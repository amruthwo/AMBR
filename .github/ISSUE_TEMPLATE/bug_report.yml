name: Bug report
description: Something isn't working right
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open …\n2. Tap …\n3. See …"
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: AMBR version
      description: Settings → About
      placeholder: "3.0.2"
    validations: { required: true }
  - type: input
    id: device
    attributes:
      label: Phone and Android version
      placeholder: "Pixel 8, Android 16"
    validations: { required: true }
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Feed / playback, Folders / hidden folders, Mind Meld, Cram Session, Save to AMBR (downloads), Settings, Other]
  - type: textarea
    id: extra
    attributes:
      label: Error text, screenshots or logs
      description: For downloads, paste the exact error. Please remove anything personal.
