name: Feature request
description: An idea to make AMBR better
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
    validations: { required: true }
  - type: textarea
    id: why
    attributes:
      label: Why? What problem does it solve?
  - type: textarea
    id: alt
    attributes:
      label: Anything you've tried or seen elsewhere?
